<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carwash Kactus - Lavado y Cuidado Automotriz</title>
    
    <!-- Favicon personalizado con la letra K celeste -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d1117'/><text x='50%' y='72%' font-size='70' font-weight='bold' font-family='Arial, sans-serif' fill='%2338bdf8' text-anchor='middle'>K</text></svg>">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f17;
            color: #e6edf3;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header / Banner con efecto de agua y burbujas */
        header {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 35px 30px;
            background: linear-gradient(135deg, #0284c7, #0369a1, #0f766e);
            border-radius: 16px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3);
            border: 1px solid rgba(56, 189, 248, 0.2);
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-content {
            position: relative;
            z-index: 2;
            max-width: 60%;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            color: #e0f2fe;
            margin-top: 5px;
        }

        /* Botón / Cartel de Google Maps */
        .location-btn {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(13, 17, 23, 0.85);
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            color: #ffffff;
            border: 2px solid #38bdf8;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .location-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }

        .location-btn img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .location-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .location-text span.title {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .location-text span.subtitle {
            font-size: 0.75rem;
            opacity: 0.85;
        }

        /* Animación de burbujas flotantes */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -20px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: floatUp 8s infinite ease-in;
        }

        .bubble:nth-child(1) { left: 10%; width: 15px; height: 15px; animation-duration: 6s; animation-delay: 0s; }
        .bubble:nth-child(2) { left: 25%; width: 25px; height: 25px; animation-duration: 9s; animation-delay: 1s; }
        .bubble:nth-child(3) { left: 45%; width: 10px; height: 10px; animation-duration: 5s; animation-delay: 2s; }
        .bubble:nth-child(4) { left: 65%; width: 20px; height: 20px; animation-duration: 7s; animation-delay: 0.5s; }
        .bubble:nth-child(5) { left: 80%; width: 30px; height: 30px; animation-duration: 10s; animation-delay: 1.5s; }
        .bubble:nth-child(6) { left: 92%; width: 12px; height: 12px; animation-duration: 6s; animation-delay: 3s; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-160px) scale(1.3);
                opacity: 0;
            }
        }

        /* Galería */
        .gallery-title {
            text-align: center;
            margin: 35px 0 25px;
            font-size: 1.9rem;
            color: #38bdf8;
            font-weight: 700;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 22px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: #38bdf8;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
        }

        .card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #8b949e;
            border-top: 1px solid #30363d;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            .header-content {
                max-width: 100%;
            }
            .location-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <!-- Efecto de burbujas -->
            <div class="bubbles">
                <div class="bubble"></div>
                <div class="bubble"></div>
                <div class="bubble"></div>
                <div class="bubble"></div>
                <div class="bubble"></div>
                <div class="bubble"></div>
            </div>

            <div class="header-content">
                <h1>Carwash Kactus</h1>
                <p>Servicio Profesional de Lavado y Cuidado Automotriz</p>
            </div>

            <!-- Cartel / Botón GPS Google Maps -->
            <a href="https://maps.app.goo.gl/qSCLzeF1Up7ykjqo9" target="_blank" class="location-btn" title="Ver ubicación en Google Maps">
                <img src="gps.png" alt="Icono GPS">
                <div class="location-text">
                    <span class="title">¡Ubícanos aquí!</span>
                    <span class="subtitle">Abrir en Google Maps</span>
                </div>
            </a>
        </header>

        <h2 class="gallery-title">Nuestros Servicios y Trabajos</h2>

        <div class="gallery">
            <div class="card"><img src="1.png" alt="Servicio 1"></div>
            <div class="card"><img src="2.png" alt="Servicio 2"></div>
            <div class="card"><img src="3.png" alt="Servicio 3"></div>
            <div class="card"><img src="4.png" alt="Servicio 4"></div>
            <div class="card"><img src="5.png" alt="Servicio 5"></div>
            <div class="card"><img src="6.png" alt="Servicio 6"></div>
        </div>

        <footer>
            <p>&copy; 2026 Carwash Kactus. Todos los derechos reservados.</p>
        </footer>
    </div>

</body>
</html>
