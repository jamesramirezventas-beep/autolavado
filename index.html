<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carwash Kactus - Lavado y Cuidado Automotriz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #e6edf3;
            line-height: 1.6;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1f6beb, #0969da);
            border-radius: 12px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .gallery-title {
            text-align: center;
            margin: 30px 0 20px;
            font-size: 1.8rem;
            color: #58a6ff;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 15px;
            text-align: center;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #8b949e;
            border-top: 1px solid #30363d;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Carwash Kactus</h1>
            <p>Servicio Profesional de Lavado y Cuidado Automotriz</p>
        </header>

        <h2 class="gallery-title">Nuestros Servicios y Trabajos</h2>

        <div class="gallery">
            <div class="card">
                <img src="1.png" alt="Carwash Kactus Image 1">
            </div>
            <div class="card">
                <img src="2.png" alt="Carwash Kactus Image 2">
            </div>
            <div class="card">
                <img src="3.png" alt="Carwash Kactus Image 3">
            </div>
            <div class="card">
                <img src="4.png" alt="Carwash Kactus Image 4">
            </div>
            <div class="card">
                <img src="5.png" alt="Carwash Kactus Image 5">
            </div>
            <div class="card">
                <img src="6.png" alt="Carwash Kactus Image 6">
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Carwash Kactus. Todos los derechos reservados.</p>
        </footer>
    </div>

</body>
</html>
