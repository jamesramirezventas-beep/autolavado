<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carwash Kactus - Lavado y Cuidado Automotriz</title>
    
    <!-- Favicon personalizado con la letra K celeste -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230284c7'/><text x='50%' y='72%' font-size='70' font-weight='bold' font-family='Arial, sans-serif' fill='%23ffffff' text-anchor='middle'>K</text></svg>">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #e0f2fe 0%, #dcfce7 50%, #f0fdf4 100%);
            color: #0f172a;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* Banner Principal Superior */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 20px 35px;
            background: linear-gradient(135deg, #0284c7, #0369a1, #0d9488);
            border-radius: 20px;
            margin-bottom: 35px;
            box-shadow: 0 12px 30px rgba(2, 132, 199, 0.25);
            border: 2px solid #38bdf8;
            color: #ffffff;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 3px 8px rgba(0,0,0,0.3);
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }

        header p.subtitle {
            font-size: 1.3rem;
            color: #e0f2fe;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Botón Parpadeante de Google Maps Centrado y Grande */
        .map-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .location-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background-color: #facc15;
            color: #0f172a;
            padding: 18px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 25px rgba(250, 204, 21, 0.6);
            transition: transform 0.2s ease;
            animation: pulseBlink 1.5s infinite alternate;
            cursor: pointer;
        }

        .location-btn img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .location-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .location-text span.title {
            font-size: 1.4rem;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .location-text span.subtitle {
            font-size: 0.95rem;
            color: #334155;
            font-weight: 600;
        }

        /* Animación Parpadeo / Pulsación */
        @keyframes pulseBlink {
            0% {
                transform: scale(1);
                background-color: #facc15;
                box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.7);
            }
            50% {
                background-color: #fde047;
            }
            100% {
                transform: scale(1.06);
                background-color: #eab308;
                box-shadow: 0 0 0 18px rgba(250, 204, 21, 0);
            }
        }

        .location-btn:hover {
            animation: none;
            transform: scale(1.08);
            background-color: #ffffff;
            color: #0284c7;
        }

        /* Enlace completo debajo del botón */
        .direct-link {
            margin-top: 12px;
            font-size: 0.95rem;
            color: #f8fafc;
            text-decoration: underline;
            word-break: break-all;
            opacity: 0.95;
            font-weight: 600;
        }

        .direct-link a {
            color: #ffffff;
            text-decoration: underline;
        }

        .direct-link a:hover {
            color: #facc15;
        }

        /* Galería */
        .gallery-title {
            text-align: center;
            margin: 35px 0 25px;
            font-size: 2.2rem;
            color: #0369a1;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: #ffffff;
            border: 2px solid #bae6fd;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #0284c7;
            box-shadow: 0 15px 30px rgba(2, 132, 199, 0.2);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 25px;
            color: #475569;
            border-top: 2px solid #cbd5e1;
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* Animación Global de Burbujas de Jabón */
        .bubbles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(186, 230, 253, 0.4));
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.15), inset 0 0 8px rgba(255, 255, 255, 0.6);
            animation: floatUpGlobal linear infinite;
        }

        .bubble:nth-child(1) { left: 5%; width: 25px; height: 25px; animation-duration: 8s; animation-delay: 0s; }
        .bubble:nth-child(2) { left: 18%; width: 45px; height: 45px; animation-duration: 12s; animation-delay: 2s; }
        .bubble:nth-child(3) { left: 32%; width: 18px; height: 18px; animation-duration: 7s; animation-delay: 1s; }
        .bubble:nth-child(4) { left: 48%; width: 35px; height: 35px; animation-duration: 10s; animation-delay: 3s; }
        .bubble:nth-child(5) { left: 62%; width: 50px; height: 50px; animation-duration: 14s; animation-delay: 0.5s; }
        .bubble:nth-child(6) { left: 75%; width: 22px; height: 22px; animation-duration: 9s; animation-delay: 4s; }
        .bubble:nth-child(7) { left: 88%; width: 40px; height: 40px; animation-duration: 11s; animation-delay: 1.5s; }
        .bubble:nth-child(8) { left: 95%; width: 28px; height: 28px; animation-duration: 8s; animation-delay: 2.5s; }

        @keyframes floatUpGlobal {
            0% {
                transform: translateY(0) scale(1) translateX(0);
                opacity: 0.85;
            }
            50% {
                transform: translateY(-50vh) scale(1.1) translateX(15px);
            }
            100% {
                transform: translateY(-105vh) scale(1.25) translateX(-15px);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.5rem;
            }
            .location-btn {
                padding: 15px 24px;
                width: 90%;
            }
            .location-text span.title {
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>

    <!-- Fondo Interactivo de Burbujas de Jabón -->
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <header>
            <h1>Carwash Kactus</h1>
            <p class="subtitle">Servicio Profesional de Lavado y Cuidado Automotriz</p>

            <!-- Sección de Ubicación Centrada -->
            <div class="map-section">
                <a href="https://maps.app.goo.gl/qSCLzeF1Up7ykjqo9" target="_blank" class="location-btn" title="Ver ubicación en Google Maps">
                    <img src="gps.png" alt="Icono GPS">
                    <div class="location-text">
                        <span class="title">¡Ubícanos aquí!</span>
                        <span class="subtitle">Haz clic para abrir Google Maps</span>
                    </div>
                </a>
                <p class="direct-link">
                    <a href="https://maps.app.goo.gl/qSCLzeF1Up7ykjqo9" target="_blank">https://maps.app.goo.gl/qSCLzeF1Up7ykjqo9</a>
                </p>
            </div>
        </header>

        <h2 class="gallery-title">Nuestros Servicios y Trabajos</h2>

        <div class="gallery">
            <div class="card"><img src="1.png" alt="Servicio 1"></div>
            <div class="card"><img src="2.png" alt="Servicio 2"></div>
            <div class="card"><img src="3.png" alt="Servicio 3"></div>
            <div class="card"><img src="4.png" alt="Servicio 4"></div>
            <div class="card"><img src="5.png" alt="Servicio 5"></div>
            <div class="card"><img src="6.png" alt="Servicio 6"></div>
        </div>

        <footer>
            <p>&copy; 2026 Carwash Kactus. Todos los derechos reservados.</p>
        </footer>
    </div>

</body>
</html>
